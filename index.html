<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geocracy Information Secrète</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #0f1117; color: #e2e8f0; min-height: 100vh; }
  header { background: #1a1f2e; border-bottom: 1px solid #2d3748; padding: 1rem 1.5rem; display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 18px; font-weight: 600; color: #f6ad55; }
  header span { font-size: 13px; color: #718096; }
  .container { max-width: 960px; margin: 0 auto; padding: 1.5rem; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 1.5rem; }
  .stat { background: #1a1f2e; border: 1px solid #2d3748; border-radius: 10px; padding: 1rem; text-align: center; }
  .stat-n { font-size: 28px; font-weight: 700; color: #f6ad55; }
  .stat-l { font-size: 12px; color: #718096; margin-top: 2px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 1.25rem; flex-wrap: wrap; }
  .tab { flex: 1; padding: 9px; font-size: 13px; font-weight: 500; cursor: pointer; border-radius: 8px; border: 1px solid #2d3748; background: transparent; color: #718096; transition: all 0.15s; min-width: 100px; }
  .tab.active { background: #2d3748; color: #f6ad55; border-color: #f6ad55; }
  .tab:hover:not(.active) { background: #1a1f2e; color: #e2e8f0; }
  .panel { display: none; }
  .panel.active { display: block; }
  .card { background: #1a1f2e; border: 1px solid #2d3748; border-radius: 12px; padding: 1.25rem; margin-bottom: 1.5rem; }
  .card h3 { font-size: 14px; color: #a0aec0; margin-bottom: 1rem; font-weight: 500; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 12px; color: #718096; }
  input { background: #0f1117; border: 1px solid #2d3748; border-radius: 8px; padding: 8px 12px; font-size: 14px; color: #e2e8f0; width: 100%; outline: none; transition: border 0.15s; }
  input:focus { border-color: #f6ad55; }
  input::placeholder { color: #4a5568; }
  button { background: #f6ad55; color: #1a1f2e; border: none; border-radius: 8px; padding: 9px 16px; font-size: 13px; font-weight: 600; cursor: pointer; transition: opacity 0.15s; width: 100%; }
  button:hover { opacity: 0.85; }
  button.secondary { background: #2d3748; color: #e2e8f0; }
  .toast { font-size: 13px; padding: 9px 12px; border-radius: 8px; margin-top: 10px; display: none; }
  .toast.ok { background: #1c4532; color: #9ae6b4; display: block; }
  .toast.warn { background: #744210; color: #fbd38d; display: block; }
  .toast.err { background: #742a2a; color: #fc8181; display: block; }
  .table-wrap { background: #1a1f2e; border: 1px solid #2d3748; border-radius: 12px; overflow: hidden; margin-bottom: 1.25rem; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 600px; }
  th { background: #141824; padding: 10px 12px; text-align: left; font-weight: 500; font-size: 11px; color: #718096; border-bottom: 1px solid #2d3748; white-space: nowrap; text-transform: uppercase; letter-spacing: 0.05em; cursor: pointer; user-select: none; }
  th:hover { color: #f6ad55; }
  th.sort-asc::after { content: ' ▲'; color: #f6ad55; }
  th.sort-desc::after { content: ' ▼'; color: #f6ad55; }
  td { padding: 10px 12px; border-bottom: 1px solid #1e2535; color: #e2e8f0; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #141824; }
  .badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 99px; font-weight: 600; }
  .badge-blue { background: #1a365d; color: #90cdf4; }
  .empty { text-align: center; padding: 2.5rem; color: #4a5568; font-size: 14px; }
  .search-bar { margin-bottom: 1rem; }
  .loader { text-align: center; padding: 1rem; color: #718096; font-size: 13px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #48bb78; margin-right: 6px; }
  .dot.off { background: #fc8181; }
  #map { height: 500px; border-radius: 12px; border: 1px solid #2d3748; }
  .map-info { font-size: 13px; color: #718096; margin-bottom: 1rem; }
  .map-loading { font-size: 13px; color: #f6ad55; margin-top: 0.75rem; min-height: 20px; }
  .legend { background: #1a1f2e; border: 1px solid #2d3748; border-radius: 8px; padding: 10px 14px; margin-top: 1rem; display: flex; flex-wrap: wrap; gap: 10px; min-height: 40px; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  @media (max-width: 600px) {
    .grid2 { grid-template-columns: 1fr; }
    .stats { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>⚔️ Geocracy Information Secrète</h1>
    <span id="conn-status"><span class="dot off" id="dot"></span><span id="conn-txt">Connexion...</span></span>
  </div>
</header>

<div class="container">

  <div class="stats">
    <div class="stat"><div class="stat-n" id="s-j">0</div><div class="stat-l">joueurs</div></div>
    <div class="stat"><div class="stat-n" id="s-v">0</div><div class="stat-l">villes connues</div></div>
    <div class="stat"><div class="stat-n" id="s-a">0</div><div class="stat-l">alliances</div></div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('marche', this)">🛒 Marché</button>
    <button class="tab" onclick="switchTab('classement', this)">🏆 Classement</button>
    <button class="tab" onclick="switchTab('liste', this)">📋 Base de données</button>
    <button class="tab" onclick="switchTab('carte', this)">🗺️ Carte</button>
  </div>

  <div id="tab-marche" class="panel active">
    <div class="card">
      <h3>Ajouter depuis le marché</h3>
      <div class="grid2">
        <div class="field"><label>Nom du joueur</label><input type="text" id="m-joueur" placeholder="ex: Gildraen" /></div>
        <div class="field"><label>Ville vue sur le marché</label><input type="text" id="m-ville" placeholder="ex: Gonnehem" /></div>
      </div>
      <button onclick="ajouterMarche()">+ Ajouter</button>
      <div class="toast" id="toast-m"></div>
    </div>
  </div>

  <div id="tab-classement" class="panel">
    <div class="card">
      <h3>Ajouter depuis le classement</h3>
      <div class="grid2">
        <div class="field"><label>Nom du joueur</label><input type="text" id="c-joueur" placeholder="ex: Vfiking91" /></div>
        <div class="field"><label>Alliance</label><input type="text" id="c-alliance" placeholder="ex: DSI" /></div>
      </div>
      <div class="grid2">
        <div class="field"><label>Rang</label><input type="number" id="c-rang" placeholder="ex: 1" min="1" /></div>
        <div class="field"><label>Nb villes total</label><input type="number" id="c-villes" placeholder="ex: 12" min="1" /></div>
      </div>
      <button onclick="ajouterClassement()">+ Ajouter / Mettre à jour</button>
      <div class="toast" id="toast-c"></div>
    </div>
  </div>

  <div id="tab-liste" class="panel">
    <div class="search-bar">
      <input type="text" id="search" placeholder="🔍 Rechercher un joueur ou une alliance..." oninput="filtrer()" />
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th id="th-nom" onclick="trier('nom')">Joueur</th>
          <th id="th-alliance" onclick="trier('alliance')">Alliance</th>
          <th id="th-rang" onclick="trier('rang')">Rang</th>
          <th id="th-nb_villes" onclick="trier('nb_villes')">Nb villes</th>
          <th>Villes connues</th>
        </tr></thead>
        <tbody id="tbody"><tr><td colspan="5" class="loader">Chargement...</td></tr></tbody>
      </table>
    </div>
    <button class="secondary" onclick="exporter()" style="margin-bottom:1rem">⬇ Télécharger Excel</button>
  </div>

  <div id="tab-carte" class="panel">
    <p class="map-info">📍 Villes géolocalisées automatiquement. La couleur correspond à l'alliance du joueur.</p>
    <div id="map"></div>
    <p class="map-loading" id="map-loading"></p>
    <div class="legend" id="legend"></div>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const SUPA_URL = 'https://ufkqysrumwlydpkmowpd.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVma3F5c3J1bXdseWRwa21vd3BkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg0NDAxNDcsImV4cCI6MjA5NDAxNjE0N30.mLCydtHj1rZxkIEv90ieb3I3l5gLy18HPwpPG9lzeIg';
const HEADERS = { 'Content-Type': 'application/json', 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + SUPA_KEY };

var allData = [];
var sortCol = 'nom';
var sortDir = 1;
var mapObj = null;
var mapMarkers = [];
var allianceColors = {};
const PALETTE = ['#e74c3c','#3498db','#2ecc71','#9b59b6','#f39c12','#1abc9c','#e91e63','#ff5722','#00bcd4','#8bc34a','#ff9800','#607d8b'];

function getAllianceColor(alliance) {
  if (!alliance) return '#718096';
  var key = alliance.toUpperCase();
  if (!allianceColors[key]) {
    var idx = Object.keys(allianceColors).length % PALETTE.length;
    allianceColors[key] = PALETTE[idx];
  }
  return allianceColors[key];
}

function hexToRgba(hex, alpha) {
  var r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return 'rgba('+r+','+g+','+b+','+alpha+')';
}

async function api(method, path, body) {
  var res = await fetch(SUPA_URL + '/rest/v1/' + path, {
    method: method,
    headers: Object.assign({}, HEADERS, { 'Prefer': 'return=representation' }),
    body: body ? JSON.stringify(body) : undefined
  });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

function nrm(s) { return (s || '').trim().toLowerCase(); }

function toast(id, msg, type) {
  var t = document.getElementById(id);
  t.textContent = msg;
  t.className = 'toast ' + type;
  setTimeout(function() { t.className = 'toast'; }, 3500);
}

function switchTab(name, btn) {
  document.querySelectorAll('.panel').forEach(function(p) { p.classList.remove('active'); });
  document.querySelectorAll('.tab').forEach(function(b) { b.classList.remove('active'); });
  document.getElementById('tab-' + name).classList.add('active');
  btn.classList.add('active');
  if (name === 'liste') charger();
  if (name === 'carte') { charger().then(function(){ setTimeout(initCarte, 400); }); }
}

async function charger() {
  try {
    allData = await api('GET', 'joueurs?order=nom.asc', null);
    document.getElementById('dot').className = 'dot';
    document.getElementById('conn-txt').textContent = 'Connecté';
    rafraichir(allData);
  } catch(e) {
    document.getElementById('conn-txt').textContent = 'Erreur de connexion';
    document.getElementById('tbody').innerHTML = '<tr><td colspan="5" class="empty">Impossible de charger les données.</td></tr>';
  }
}

function trier(col) {
  if (sortCol === col) sortDir *= -1;
  else { sortCol = col; sortDir = 1; }
  document.querySelectorAll('th[id]').forEach(function(th) { th.className = ''; });
  var th = document.getElementById('th-' + col);
  if (th) th.className = sortDir === 1 ? 'sort-asc' : 'sort-desc';
  var q = nrm(document.getElementById('search').value);
  var filtered = allData.filter(function(j) {
    return nrm(j.nom).includes(q) || nrm(j.alliance).includes(q) || nrm(j.villes).includes(q);
  });
  filtered.sort(function(a, b) {
    var va = a[col] != null ? a[col] : (col === 'rang' || col === 'nb_villes' ? 99999 : 'zzz');
    var vb = b[col] != null ? b[col] : (col === 'rang' || col === 'nb_villes' ? 99999 : 'zzz');
    if (typeof va === 'string') return va.localeCompare(vb) * sortDir;
    return (va - vb) * sortDir;
  });
  rafraichir(filtered);
}

async function ajouterMarche() {
  var joueur = document.getElementById('m-joueur').value.trim();
  var ville = document.getElementById('m-ville').value.trim();
  if (!joueur || !ville) { toast('toast-m', 'Remplis les deux champs.', 'warn'); return; }
  try {
    var existing = await api('GET', 'joueurs?nom=ilike.' + encodeURIComponent(joueur), null);
    if (existing.length > 0) {
      var j = existing[0];
      var villes = j.villes ? j.villes.split(',').map(function(v){ return v.trim(); }) : [];
      if (villes.some(function(v) { return nrm(v) === nrm(ville); })) {
        toast('toast-m', ville + ' déjà associée à ' + joueur, 'warn'); return;
      }
      villes.push(ville);
      await api('PATCH', 'joueurs?id=eq.' + j.id, { villes: villes.join(', ') });
      toast('toast-m', '✓ ' + ville + ' ajoutée à ' + joueur, 'ok');
    } else {
      await api('POST', 'joueurs', { nom: joueur, villes: ville });
      toast('toast-m', '✓ Nouveau joueur ' + joueur + ' ajouté', 'ok');
    }
    document.getElementById('m-ville').value = '';
    majStats();
  } catch(e) { toast('toast-m', 'Erreur : ' + e.message, 'err'); }
}

async function ajouterClassement() {
  var joueur = document.getElementById('c-joueur').value.trim();
  var alliance = document.getElementById('c-alliance').value.trim();
  var rang = document.getElementById('c-rang').value.trim();
  var nbV = document.getElementById('c-villes').value.trim();
  if (!joueur) { toast('toast-c', 'Le nom du joueur est requis.', 'warn'); return; }
  try {
    var update = {};
    if (alliance) update.alliance = alliance.toUpperCase();
    if (rang) update.rang = parseInt(rang);
    if (nbV) update.nb_villes = parseInt(nbV);
    var existing = await api('GET', 'joueurs?nom=ilike.' + encodeURIComponent(joueur), null);
    if (existing.length > 0) {
      await api('PATCH', 'joueurs?id=eq.' + existing[0].id, update);
      toast('toast-c', '✓ ' + joueur + ' mis à jour', 'ok');
    } else {
      update.nom = joueur; update.villes = '';
      await api('POST', 'joueurs', update);
      toast('toast-c', '✓ ' + joueur + ' ajouté', 'ok');
    }
    ['c-joueur','c-alliance','c-rang','c-villes'].forEach(function(id){ document.getElementById(id).value = ''; });
    majStats();
  } catch(e) { toast('toast-c', 'Erreur : ' + e.message, 'err'); }
}

function filtrer() {
  var q = nrm(document.getElementById('search').value);
  var filtered = allData.filter(function(j) {
    return nrm(j.nom).includes(q) || nrm(j.alliance).includes(q) || nrm(j.villes).includes(q);
  });
  rafraichir(filtered);
}

function rafraichir(data) {
  var tbody = document.getElementById('tbody');
  if (!data || !data.length) {
    tbody.innerHTML = '<tr><td colspan="5" class="empty">Aucune donnée trouvée</td></tr>';
    return;
  }
  tbody.innerHTML = data.map(function(j) {
    var color = getAllianceColor(j.alliance);
    var allianceBadge = j.alliance
      ? '<span class="badge" style="background:' + hexToRgba(color,0.2) + ';color:' + color + ';border:1px solid ' + hexToRgba(color,0.5) + '">' + j.alliance + '</span>'
      : '<span style="color:#4a5568">—</span>';
    var rangTxt = j.rang ? j.rang : '<span style="color:#4a5568">—</span>';
    var nbVTxt = j.nb_villes ? '<span class="badge badge-blue">' + j.nb_villes + '</span>' : '<span style="color:#4a5568">—</span>';
    var villesTxt = j.villes || '<span style="color:#4a5568">aucune</span>';
    return '<tr>' +
      '<td style="font-weight:500;color:#f6ad55">' + j.nom + '</td>' +
      '<td>' + allianceBadge + '</td>' +
      '<td style="text-align:center">' + rangTxt + '</td>' +
      '<td style="text-align:center">' + nbVTxt + '</td>' +
      '<td style="color:#a0aec0;font-size:12px">' + villesTxt + '</td>' +
      '</tr>';
  }).join('');
}

async function majStats() {
  try {
    var data = await api('GET', 'joueurs', null);
    allData = data;
    var totalV = data.reduce(function(acc, j) {
      return acc + (j.villes ? j.villes.split(',').filter(function(v){ return v.trim(); }).length : 0);
    }, 0);
    var alliances = new Set(data.map(function(j){ return j.alliance; }).filter(Boolean));
    document.getElementById('s-j').textContent = data.length;
    document.getElementById('s-v').textContent = totalV;
    document.getElementById('s-a').textContent = alliances.size;
  } catch(e) {}
}

async function getCommune(ville) {
  try {
    // Search for the commune and get its OSM id
    var res = await fetch(
      'https://nominatim.openstreetmap.org/search?q=' + encodeURIComponent(ville + ', France') +
      '&format=json&limit=5&addressdetails=1&polygon_geojson=1',
      { headers: { 'Accept-Language': 'fr' } }
    );
    var data = await res.json();
    // Prefer results that are administrative boundaries (communes)
    var best = data.find(function(d) {
      return d.geojson && (d.geojson.type === 'Polygon' || d.geojson.type === 'MultiPolygon') &&
        (d.type === 'administrative' || d.addresstype === 'municipality' || d.addresstype === 'village' || d.addresstype === 'town' || d.addresstype === 'city' || d.class === 'boundary');
    }) || data.find(function(d) {
      return d.geojson && (d.geojson.type === 'Polygon' || d.geojson.type === 'MultiPolygon');
    });
    if (best) return { geojson: best.geojson, lat: parseFloat(best.lat), lng: parseFloat(best.lon), nom: best.display_name.split(',')[0] };
    // Fallback: just a point
    if (data.length > 0) return { geojson: null, lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon), nom: data[0].display_name.split(',')[0] };
  } catch(e) {}
  return null;
}

async function initCarte() {
  if (!mapObj) {
    mapObj = L.map('map').setView([46.6, 2.3], 6);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '© OpenStreetMap © CartoDB', maxZoom: 18
    }).addTo(mapObj);
  }
  // Remove old layers
  mapMarkers.forEach(function(m){ mapObj.removeLayer(m); });
  mapMarkers = [];
  allianceColors = {};

  var loadingEl = document.getElementById('map-loading');
  var legendEl = document.getElementById('legend');
  legendEl.innerHTML = '';

  var toProcess = [];
  allData.forEach(function(j) {
    if (!j.villes) return;
    j.villes.split(',').map(function(v){ return v.trim(); }).filter(Boolean).forEach(function(v) {
      toProcess.push({ joueur: j, ville: v });
    });
  });

  var found = 0;
  for (var i = 0; i < toProcess.length; i++) {
    var item = toProcess[i];
    loadingEl.textContent = '📍 Chargement de ' + item.ville + '... (' + (i+1) + '/' + toProcess.length + ')';
    var result = await getCommune(item.ville);
    if (!result) { await new Promise(function(r){ setTimeout(r, 300); }); continue; }

    var j = item.joueur;
    var color = getAllianceColor(j.alliance);

    var popup = '<div style="font-family:system-ui;min-width:150px">' +
      '<b style="color:' + color + ';font-size:14px">' + j.nom + '</b>' +
      (j.alliance ? ' <span style="font-size:11px;background:#2d3748;color:#e2e8f0;padding:1px 6px;border-radius:4px">' + j.alliance + '</span>' : '') +
      '<br><span style="font-size:12px;color:#aaa">📍 ' + item.ville + '</span>' +
      (j.rang ? '<br><span style="font-size:12px">🏆 Rang : <b>' + j.rang + '</b></span>' : '') +
      (j.nb_villes ? '<br><span style="font-size:12px">🏠 Villes : <b>' + j.nb_villes + '</b></span>' : '') +
      '</div>';

    if (result.geojson) {
      // Draw the commune polygon
      var layer = L.geoJSON(result.geojson, {
        style: {
          color: color,
          weight: 2,
          opacity: 0.9,
          fillColor: color,
          fillOpacity: 0.35
        }
      }).bindPopup(popup);
      layer.addTo(mapObj);
      mapMarkers.push(layer);
    } else {
      // Fallback: circle marker
      var circle = L.circleMarker([result.lat, result.lng], {
        radius: 10,
        color: color,
        weight: 2,
        fillColor: color,
        fillOpacity: 0.5
      }).bindPopup(popup);
      circle.addTo(mapObj);
      mapMarkers.push(circle);
    }
    found++;
    await new Promise(function(r){ setTimeout(r, 300); });
  }

  loadingEl.textContent = '✓ ' + found + ' ville(s) affichée(s) sur la carte.';

  Object.keys(allianceColors).sort().forEach(function(a) {
    var item = document.createElement('div');
    item.className = 'legend-item';
    item.innerHTML = '<div class="legend-dot" style="background:' + allianceColors[a] + '"></div><span>' + a + '</span>';
    legendEl.appendChild(item);
  });
  if (!Object.keys(allianceColors).length) {
    legendEl.innerHTML = '<span style="color:#718096;font-size:13px">Ajoute des alliances pour voir les couleurs</span>';
  }
}

function exporter() {
  if (!allData.length) { alert('Aucune donnée à exporter.'); return; }
  var rows = [['Nom Joueur', 'Alliance', 'Rang Classement', 'Nb Villes Total', 'Villes connues']];
  allData.forEach(function(j) {
    rows.push([j.nom, j.alliance || '', j.rang || '', j.nb_villes || '', j.villes || '']);
  });
  var wb = XLSX.utils.book_new();
  var ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = [{wch:20},{wch:12},{wch:16},{wch:16},{wch:45}];
  XLSX.utils.book_append_sheet(wb, ws, 'Joueurs');
  XLSX.writeFile(wb, 'Geocracy_Intelligence.xlsx');
}

['m-joueur','m-ville','c-joueur','c-alliance','c-rang','c-villes'].forEach(function(id, i, arr) {
  document.getElementById(id).addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      if (id === 'm-ville') ajouterMarche();
      else if (id === 'c-villes') ajouterClassement();
      else { var next = arr[i+1]; if (next) document.getElementById(next).focus(); }
    }
  });
});

majStats();
charger();
